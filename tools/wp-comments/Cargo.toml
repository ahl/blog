[package]
name = "wp-comments"
version = "0.1.0"
edition = "2021"
description = "One-shot migration tooling for the WordPress export of dtrace.org/blogs/ahl"
publish = false

[dependencies]
ammonia = "4"
anyhow = "1"
html-escape = "0.2"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "redact"
path = "src/bin/redact.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"
